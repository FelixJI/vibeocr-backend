name: Release

on:
  push:
    tags: ['v0.7.0']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable tag to recover
        required: true
        default: v0.7.0
        type: string

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
        if: hashFiles('global.json') != ''
      - name: Verify immutable tag
        shell: pwsh
        run: |
          $tag = '${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}'
          if ($tag -ne 'v0.7.0') { exit 1 }
      - name: Build release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build-release.ps1
      - uses: actions/attest@v4
        with:
          subject-checksums: artifacts/SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-checksums: artifacts/SHA256SUMS
          sbom-path: artifacts/SBOM.spdx.json
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }} artifacts/* --verify-tag --generate-notes
