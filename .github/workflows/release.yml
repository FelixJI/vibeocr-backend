name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft Release tag, for example v0.7.1
        required: true
        type: string
  # Auto-attach assets after the Release Please workflow finishes. Release Please
  # also runs for the non-draft scenario (workflow_dispatch opens the Release
  # PR), so the build job resolves the latest actionable draft and skips
  # gracefully when there is none — see the "Resolve release tag" step.
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # workflow_run events have empty inputs; auto-triggered builds serialize while
  # --clobber keeps retries self-healing for partially populated drafts.
  group: release-assets-${{ github.repository }}-${{ inputs.release_tag || 'auto' }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    name: Build and upload Windows package
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # ref resolved per-event in the next step; default checkout keeps
          # workflow_run (which has no ref context) from failing here.
      - name: Resolve release tag
        id: resolve
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Manual dispatch: trust the provided tag.
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:INPUT_TAG.Trim()
            if ([string]::IsNullOrEmpty($tag)) { throw "workflow_dispatch requires release_tag input" }
            git fetch origin "$tag" --tags --force
            git checkout "$tag"
            "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
            "release_tag=$tag" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Manual build for $tag"
            return
          }

          # Auto path (workflow_run): find the latest draft release. The tag
          # pattern tolerates prerelease suffixes (e.g. v0.1.0-preview.2).
          $drafts = gh release list --limit 50 --json tagName,isDraft `
            | ConvertFrom-Json | Where-Object { $_.isDraft -and $_.tagName -match '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$' }
          if (-not $drafts) {
            Write-Host "::notice::No actionable draft release; skipping build."
            "RELEASE_TAG=" >> $env:GITHUB_ENV
            "release_tag=" >> $env:GITHUB_OUTPUT
            return
          }
          $tag = $drafts[0].tagName
          git fetch origin "$tag" --tags --force
          git checkout "$tag"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "::notice::Auto build for draft $tag"
      - uses: actions/setup-python@v5
        if: env.RELEASE_TAG != ''
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v5
        if: env.RELEASE_TAG != '' && hashFiles('global.json') != ''
        with:
          global-json-file: global.json
      - name: Verify tag and draft Release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $version = (python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('packages/vibeocr-backend/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match repository version v$version"
          }
          $isDraft = (gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft').Trim()
          if ($isDraft -ne "true") {
            throw "Release $env:RELEASE_TAG must exist and remain a draft before assets are uploaded"
          }
      - name: Build release assets
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version '${{ env.RELEASE_TAG }}'
      - name: Verify release candidate assets
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          python scripts/verify_release_assets.py artifacts `
            --require runtime-manifest.json `
            --require protocol-release-manifest.json `
            --require requirements-win-x64-cpu.lock `
            --require requirements-win-x64-cu126.lock `
            --require SBOM.spdx.json `
            --require-one 'vibeocr_backend-*.whl' `
            --require-one 'vibeocr_runtime_contracts-2.*.whl' `
            --require-one 'vibeocr-runtime-installer-*.zip' `
            --require-one 'cpython-*-install_only.tar.gz'
      - name: Upload release candidate artifact
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/attest@v4
        if: env.RELEASE_TAG != ''
        with:
          subject-checksums: artifacts/SHA256SUMS
      - uses: actions/attest@v4
        if: env.RELEASE_TAG != ''
        with:
          subject-checksums: artifacts/SHA256SUMS
          sbom-path: artifacts/SBOM.spdx.json
      - name: Attach assets to draft Release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $assets = @(Get-ChildItem artifacts -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --clobber
      - name: Verify uploaded Release assets
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $expected = @(Get-ChildItem artifacts -File | ForEach-Object Name)
          $uploaded = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
          $missing = @($expected | Where-Object { $_ -notin $uploaded })
          if ($missing.Count -ne 0) {
            throw "Release $env:RELEASE_TAG is missing assets: $($missing -join ', ')"
          }
      - name: Publish verified Release
        if: env.RELEASE_TAG != '' && github.event_name == 'workflow_run'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: gh release edit $env:RELEASE_TAG --draft=false
