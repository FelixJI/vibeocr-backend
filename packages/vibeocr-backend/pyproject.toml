[project]
name = "vibeocr-backend"
version = "0.13.11"
description = "UI-free VibeOCR inference Supervisor runtime"
requires-python = ">=3.13,<3.14"
dependencies = [
    "vibeocr-runtime-contracts>=2.8.1,<3.0.0",
    "pillow>=12.3.0",
    "numpy>=2.3.5",
    "httpx>=0.28.1",
    "jsonschema>=4.25.0",
    "pymupdf>=1.28.0",
    "pydantic>=2.13.4",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "fonttools>=4.63.0",
    "markdown>=3.10.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "qrcode[pil]>=8.2",
    "python-barcode>=0.16.1",
    "pyzbar>=0.1.9",
    "pynvml>=11.5.0",
    "packaging>=26.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
# Engine environments are installed separately by the runtime installer.
cpu = ["mineru==4.0.2", "opencv-python>=4.11"]
gpu-cu126 = ["mineru[torch]==4.0.2", "opencv-python>=4.11"]
paddle-cpu = ["paddlepaddle>=3.3.1", "paddleocr[doc-parser]>=3.7.0"]
paddle-cu126 = ["paddlepaddle-gpu>=3.3.1", "paddleocr[doc-parser]>=3.7.0"]

[project.scripts]
vibeocr-supervisor = "vibeocr.backend.supervisor.main:main"
vibeocr-runtime-installer = "vibeocr.backend.runtime_installer:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeocr"]

[tool.hatch.build.targets.wheel.force-include]
"src/vibeocr/backend/dependency_profiles.json" = "vibeocr/backend/dependency_profiles.json"
